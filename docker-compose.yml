services:
  etc-postgres:
    container_name: pg-database
    image: postgres:17-alpine
    shm_size: 128mb
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: todolist
    ports:
      - 5432:5432
    networks:
      - todolist

networks:
  todolist:

volumes:
  todolist:
